<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عرش النهوض | نسخة تجريبية</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a29;color:#f5e9ce;font-family:system-ui,Tahoma}header{padding:18px;text-align:center;background:#192b40;border-bottom:2px solid #bd9250}h1{margin:0;color:#f5cb7a}small{color:#b4c1cd}.wrap{max-width:1000px;margin:auto;padding:14px}.stats,.actions,.layout{display:grid;gap:10px}.stats{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1.3fr 1fr;margin-top:12px}.panel{background:#1b2b3d;border:1px solid #40526a;border-radius:14px;padding:15px}.stats .panel{text-align:center}b{color:#f5c778}button{background:#9d7239;color:white;border:1px solid #e2b76a;border-radius:9px;padding:11px;margin:4px;cursor:pointer;font-weight:bold}button:hover{background:#b98945}button:disabled{opacity:.45}h2{font-size:19px;margin:4px 0 12px}.map{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.tile{aspect-ratio:1;display:grid;place-items:center;background:#29483f;border:1px solid #527b68;border-radius:8px;font-size:24px;cursor:pointer}.tile.castle{background:#645136}.tile.enemy{background:#56353c}.tile.mine{background:#34506b}.tile.selected{outline:3px solid #f7ce6b}.log{height:115px;overflow:auto;font-size:13px;color:#d6e1ec}input{width:100%;padding:10px;border-radius:8px;background:#0e1928;color:white;border:1px solid #52647a}footer{text-align:center;color:#8ea0b5;padding:20px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.tile{font-size:20px}}</style>
<header><h1>👑 عرش النهوض</h1><small>Rise of Thrones — تجربة استراتيجية أصلية قابلة للعب</small></header><main class="wrap"><section class="stats"><div class="panel">🪵 خشب<br><b id="wood"></b></div><div class="panel">🪨 حجر<br><b id="stone"></b></div><div class="panel">🪙 ذهب<br><b id="gold"></b></div><div class="panel">⚔️ جيش<br><b id="army"></b></div></section><div class="layout"><section class="panel"><h2>🗺️ خريطة المملكة</h2><div class="map" id="map"></div><p id="target">اختر موقعًا على الخريطة.</p><button onclick="explore()">استكشاف / هجوم</button><button onclick="gather()">جمع الموارد</button></section><section class="panel"><h2>🏰 إدارة المملكة</h2><p>مستوى القلعة: <b id="level"></b> | قوة الأبطال: <b id="hero"></b></p><button onclick="upgrade()">تطوير القلعة (100 خشب، 80 حجر)</button><button onclick="train()">تدريب 10 جنود (60 ذهب)</button><button onclick="heroUp()">تطوير البطل (90 ذهب)</button><h2>🤝 التحالف والتجارة</h2><input id="alliance" placeholder="اسم تحالفك"><button onclick="join()">تأسيس تحالف</button><p id="allianceName"></p><button onclick="trade()">بيع 50 خشب مقابل 40 ذهب</button><h2>📜 سجل الأحداث</h2><div class="log" id="log"></div><button onclick="reset()">بدء لعبة جديدة</button></section></div></main><footer>نسخة أولية محلية — تحفظ تقدمك في هذا المتصفح. اللعب الجماعي الحقيقي يتطلب خادمًا.</footer><script>
const initial=()=>({wood:240,stone:200,gold:220,army:30,level:1,hero:1,alliance:'',claimed:[],logs:['بدأت رحلتك لتأسيس المملكة.']});
let s;try{s=JSON.parse(localStorage.getItem('rot-save'))||initial()}catch{s=initial()}let selected=0;
const tiles=Array.from({length:36},(_,i)=>i===14?'🏰':i%11===0?'👹':i%7===0?'⛏️':i%5===0?'🌲':'🌿');
function save(){localStorage.setItem('rot-save',JSON.stringify(s));render()}
function msg(t){s.logs.unshift(t);s.logs=s.logs.slice(0,30);save()}
function render(){for(const k of ['wood','stone','gold','army','level','hero'])document.getElementById(k).textContent=s[k];document.getElementById('allianceName').textContent=s.alliance?'تحالفك: '+s.alliance:'لا يوجد تحالف بعد';document.getElementById('log').innerHTML=s.logs.map(x=>'<p>'+escapeHTML(x)+'</p>').join('');document.getElementById('map').innerHTML=tiles.map((t,i)=>`<div role="button" tabindex="0" aria-label="الموقع ${i+1}" class="tile ${t==='🏰'?'castle':t==='👹'?'enemy':t==='⛏️'?'mine':''} ${i===selected?'selected':''}" onclick="select(${i})" onkeydown="if(event.key==='Enter')select(${i})">${s.claimed.includes(i)?'🚩':t}</div>`).join('');document.getElementById('target').textContent='الموقع '+(selected+1)+' — '+(s.claimed.includes(selected)?'تحت سيطرتك':tiles[selected]==='👹'?'معسكر أعداء':tiles[selected]==='⛏️'?'منجم':'أرض قابلة للاستكشاف')}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function select(i){selected=i;render()}
function upgrade(){if(s.wood<100||s.stone<80)return msg('موارد غير كافية لتطوير القلعة');s.wood-=100;s.stone-=80;s.level++;msg('ارتفع مستوى القلعة إلى '+s.level)}
function train(){if(s.gold<60)return msg('لا يوجد ذهب كافٍ');s.gold-=60;s.army+=10;msg('انضم 10 جنود إلى جيشك')}
function heroUp(){if(s.gold<90)return msg('لا يوجد ذهب كافٍ');s.gold-=90;s.hero++;msg('ازدادت قوة البطل')}
function explore(){if(selected===14)return msg('هذه قلعتك الرئيسية');if(s.claimed.includes(selected))return msg('هذه الأرض تحت سيطرتك');let enemy=tiles[selected]==='👹';if(enemy&&s.army+s.hero*5<25)return msg('جيشك ضعيف للهجوم');if(enemy){s.army=Math.max(0,s.army-8);s.gold+=80} else{s.wood+=25;s.stone+=15}s.claimed.push(selected);msg(enemy?'انتصرت في المعركة! خسرت 8 جنود وربحت 80 ذهبًا':'استكشفت أرضًا جديدة وحصلت على موارد')}
function gather(){if(tiles[selected]!=='⛏️'&&tiles[selected]!=='🌲')return msg('اختر منجمًا أو غابة لجمع الموارد');if(tiles[selected]==='⛏️'){s.stone+=45;s.gold+=15}else{s.wood+=60}msg('جمعت موارد من الموقع '+(selected+1))}
function trade(){if(s.wood<50)return msg('لا يوجد خشب كافٍ للتجارة');s.wood-=50;s.gold+=40;msg('تمت صفقة التجارة بنجاح')}
function join(){let name=document.getElementById('alliance').value.trim().slice(0,30);if(!name)return msg('أدخل اسم التحالف');s.alliance=name;msg('تأسس تحالف '+name+' (محلي تجريبي)')}
function reset(){if(confirm('هل تريد حذف تقدمك؟')){s=initial();save()}}render();
</script></html>
